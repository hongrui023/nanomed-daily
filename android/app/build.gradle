plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nanomed.daily'
    compileSdk 34

    defaultConfig {
        applicationId "com.nanomed.daily"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('../keystore.p12')
            storePassword 'nanomed2026'
            keyAlias 'nanomed'
            keyPassword 'nanomed2026'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
