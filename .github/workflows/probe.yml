name: 探测构建环境

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 查看安卓与构建工具环境
        run: |
          echo "===== Java ====="
          java -version 2>&1 | head -3
          echo "JAVA_HOME=$JAVA_HOME"
          echo
          echo "===== Gradle ====="
          which gradle && gradle -v 2>&1 | grep -E "^Gradle|JVM" || echo "未预装 gradle"
          echo
          echo "===== Android SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" 2>/dev/null | head -20 || echo "无 ANDROID_HOME"
          echo
          echo "===== 已装 SDK 包 ====="
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "无 platforms"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "无 build-tools"
